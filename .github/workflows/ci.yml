name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision native runtime build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 cmake ninja-build python3

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        id: tests
        env:
          TMPDIR: ${{ runner.temp }}
          PHOTOCTL_MODELS_BASE_URL: ${{ vars.PHOTOCTL_MODELS_BASE_URL }}
        run: bun run test

      - name: Preserve failed-test daemon logs
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daemon-startup-logs
          path: ${{ runner.temp }}/photoctl-????????.log
          retention-days: 3
          if-no-files-found: ignore
