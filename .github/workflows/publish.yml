name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate release tag
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME !== `v${p.version}`) throw Error("Release tag must match package.json version")'
      - name: Acquire pinned official ONNX models and retain notices
        run: |
          bun install --frozen-lockfile
          bun run build:ts
          node scripts/fetch-models.mjs out/models
          node scripts/verify-release-models.mjs out/models
      - uses: actions/upload-artifact@v4
        with:
          name: release-models
          path: out/models/
          if-no-files-found: error

  native:
    needs: models
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            package: img-linux-x64-gnu
            addon: photoctl-image.linux-x64-gnu.node
          - runner: ubuntu-24.04-arm
            package: img-linux-arm64-gnu
            addon: photoctl-image.linux-arm64-gnu.node
          - runner: macos-15
            package: img-darwin-arm64
            addon: photoctl-image.darwin-arm64.node
            helper: mac-helper-darwin-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select macOS release toolchain
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          swift --version
          swift package --package-path helpers/mac dump-package > /dev/null

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision Linux runtime build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 cmake ninja-build python3

      - name: Provision macOS runtime build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set up Python for native runtime build
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build native image runtime
        run: bun run build:rust:release

      - name: Build TypeScript
        run: bun run build:ts

      - name: Download release models
        if: matrix.package == 'img-darwin-arm64'
        uses: actions/download-artifact@v4
        with:
          name: release-models
          path: out/models

      - name: Verify native runtime with release models
        if: matrix.package == 'img-darwin-arm64'
        env:
          PHOTOCTL_SEGMENT_MODELS_DIR: ${{ github.workspace }}/out/models
        run: bun run test:models

      - name: Build macOS helper
        if: runner.os == 'macOS'
        run: bun run build:swift:release

      - name: Upload macOS helper
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.helper }}
          path: packages/${{ matrix.helper }}/photoctl-mac
          if-no-files-found: error

      - name: Verify packed macOS runtime
        if: matrix.package == 'img-darwin-arm64'
        run: bun run build:ts && bun x vitest run --config vitest.macos.config.ts test/macos/packed-install.test.ts test/macos/linkage.test.ts

      - name: Upload native image runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.package }}
          path: packages/${{ matrix.package }}/${{ matrix.addon }}
          if-no-files-found: error

  release:
    needs: native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:ts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Smoke tests
        run: bun run test:ci

      - name: Download release models
        uses: actions/download-artifact@v4
        with:
          name: release-models
          path: out/models

      - name: Verify release model bytes
        run: node scripts/verify-release-models.mjs out/models

      - name: Download Linux x64 runtime
        uses: actions/download-artifact@v4
        with:
          name: native-img-linux-x64-gnu
          path: packages/img-linux-x64-gnu

      - name: Download Linux ARM64 runtime
        uses: actions/download-artifact@v4
        with:
          name: native-img-linux-arm64-gnu
          path: packages/img-linux-arm64-gnu

      - name: Download Darwin ARM64 runtime
        uses: actions/download-artifact@v4
        with:
          name: native-img-darwin-arm64
          path: packages/img-darwin-arm64

      - name: Download Darwin ARM64 helper
        uses: actions/download-artifact@v4
        with:
          name: native-mac-helper-darwin-arm64
          path: packages/mac-helper-darwin-arm64

      - name: Restore helper executable permissions
        run: chmod +x packages/mac-helper-*/photoctl-mac

      - name: Pack release artifacts
        run: node scripts/pack.mjs --all

      - name: Assemble draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/packages/*.tgz
            out/models/encoder.onnx
            out/models/decoder.onnx
            out/models/models.json
            out/models/SHA256SUMS
            out/models/ZIM-LICENSE
            out/models/ZIM-NOTICE

      - name: Publish complete release before npm
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify public model downloads
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/fetch-models.mjs out/public-models --base-url "https://github.com/dzhng/photoctl/releases/download/$RELEASE_TAG/"

      - name: Publish to npm
        run: node scripts/publish-npm.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
