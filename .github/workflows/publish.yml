name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  native:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            package: img-linux-x64-gnu
            addon: photoctl-image.linux-x64-gnu.node
          - runner: ubuntu-24.04-arm
            package: img-linux-arm64-gnu
            addon: photoctl-image.linux-arm64-gnu.node
          - runner: macos-15
            package: img-darwin-arm64
            addon: photoctl-image.darwin-arm64.node
          - runner: macos-15-intel
            package: img-darwin-x64
            addon: photoctl-image.darwin-x64.node
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native image runtime
        run: bun run build:rust

      - name: Upload native image runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.package }}
          path: packages/${{ matrix.package }}/${{ matrix.addon }}
          if-no-files-found: error

  release:
    needs: native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Download Linux x64 runtime
        uses: actions/download-artifact@v4
        with:
          name: native-img-linux-x64-gnu
          path: packages/img-linux-x64-gnu

      - name: Download Linux ARM64 runtime
        uses: actions/download-artifact@v4
        with:
          name: native-img-linux-arm64-gnu
          path: packages/img-linux-arm64-gnu

      - name: Download Darwin ARM64 runtime
        uses: actions/download-artifact@v4
        with:
          name: native-img-darwin-arm64
          path: packages/img-darwin-arm64

      - name: Download Darwin x64 runtime
        uses: actions/download-artifact@v4
        with:
          name: native-img-darwin-x64
          path: packages/img-darwin-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to npm
        run: bun run publish:npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
