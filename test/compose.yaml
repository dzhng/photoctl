services:
  functional:
    # Filesystem tests need permission failures even when the container runs as root.
    cap_drop: [DAC_OVERRIDE, DAC_READ_SEARCH]
    build:
      context: ..
      dockerfile: test/Dockerfile
      target: functional
      args:
        PHOTOCTL_MODELS_BASE_URL: ${PHOTOCTL_MODELS_BASE_URL:-}
    environment:
      PHOTOCTL_GATEWAY_URL: http://gateway-fixture:8787
      PHOTOCTL_NO_DAEMON: "1"
    depends_on: [gateway-fixture]
  gateway-fixture:
    build:
      context: ..
      dockerfile: test/Dockerfile
      target: built
    command: ["node","packages/test-harness/dist/gateway-server.js"]
